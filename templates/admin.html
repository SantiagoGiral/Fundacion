<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel — Colombia Prospera</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;background:#F8FAF8;color:#1a332d;margin:0}
    header{background:#103C34;color:#fff;padding:16px 7%;display:flex;justify-content:space-between;align-items:center}
    a{color:inherit}
    main{padding:24px 7% 48px}
    section{background:#fff;border-radius:16px;padding:18px;margin:0 0 18px;box-shadow:0 8px 24px rgba(16,60,52,.08)}
    h2{margin:0 0 12px;font-size:18px;color:#103C34}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:8px;border-bottom:1px solid #e6eee8;vertical-align:top}
    .empty{color:#5d746c}
    .top{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .stat{background:#fff;padding:14px 18px;border-radius:14px;min-width:120px;box-shadow:0 8px 24px rgba(16,60,52,.08)}
    .stat b{display:block;font-size:22px;color:#103C34}
  </style>
</head>
<body>
  <header>
    <strong>Colombia Prospera — Panel</strong>
    <a href="/admin/salir">Salir</a>
  </header>
  <main>
    <div class="top">__STATS__</div>
    __SECTIONS__
  </main>
</body>
</html>
